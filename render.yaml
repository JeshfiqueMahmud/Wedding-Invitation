# Render Blueprint — creates the web service with a persistent disk for the RSVP database.
# In Render: New → Blueprint → pick this repository.
services:
  - type: web
    name: wedding-invitation
    runtime: node
    plan: starter            # persistent disks need a paid plan; the free plan would wipe RSVPs on restart
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/wedding.db
      - key: ADMIN_PIN
        sync: false          # Render asks you to type this in; it is never stored in the repo
    disk:
      name: wedding-data
      mountPath: /data
      sizeGB: 1
