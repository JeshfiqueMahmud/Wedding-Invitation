# Render Blueprint — the Express API on Render's FREE web service.
# Render → New → Blueprint → pick this repository. You'll be asked for the values marked sync: false.
# The website itself is on GitHub Pages; data lives in Supabase, so nothing is lost when this sleeps.
services:
  - type: web
    name: wedding-api
    runtime: node
    plan: free
    region: singapore          # closest Render region to Dhaka
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: ALLOWED_ORIGINS
        value: https://jeshfiquemahmud.github.io
      - key: DATABASE_URL        # Supabase → Connect → Session pooler string
        sync: false
      - key: SUPABASE_URL        # https://<project-ref>.supabase.co
        sync: false
      - key: SUPABASE_SERVICE_KEY # Supabase → Project Settings → API Keys → service_role / secret key
        sync: false
      - key: ADMIN_PASSWORD      # the organizer dashboard password
        sync: false
