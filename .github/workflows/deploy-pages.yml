# Builds the React site and publishes it to GitHub Pages on every push to main.
# Repository → Settings → Pages → Source must be set to "GitHub Actions".
# Values come from Repository → Settings → Secrets and variables → Actions → Variables.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Served at https://<user>.github.io/<repo>/ — assets need this prefix.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Warn about missing settings
        run: |
          [ -n "${{ vars.VITE_API_URL }}" ] || echo "::warning::VITE_API_URL is not set — RSVPs and the guestbook will not reach the backend."
          [ -n "${{ vars.VITE_SUPABASE_URL }}" ] || echo "::warning::VITE_SUPABASE_URL is not set — photos will load through the backend or fall back to bundled ones."

      # Single-page app: unknown paths (e.g. a refresh on a deep link) fall back to the app.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
