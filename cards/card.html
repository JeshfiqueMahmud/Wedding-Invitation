<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Invitation Card</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500&family=Marcellus&family=Pinyon+Script&family=Tiro+Bangla&display=block" rel="stylesheet" />
<style>
  /* Render at 540x960 CSS px with device scale 2 → 1080x1920 PNG */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 540px; height: 960px; overflow: hidden; }

  body.holud {
    --bg1: #F7C04E; --bg2: #E8901F; --ink: #2A1306; --soft: rgba(42,19,6,.72);
    --accent: #B8321F; --line: rgba(42,19,6,.38); --leaf: #3F6B48; --glow: rgba(255,240,190,.55);
    --wm: #8C3A10;
  }
  body.reception {
    --bg1: #1B1633; --bg2: #0B0917; --ink: #F7EFE1; --soft: rgba(242,227,199,.72);
    --accent: #EBC57E; --line: rgba(226,166,62,.45); --leaf: #C9432F; --glow: rgba(235,197,126,.16);
    --wm: #E2A63E;
  }

  body {
    background: radial-gradient(ellipse 80% 55% at 50% 38%, var(--bg1), var(--bg2));
    color: var(--ink);
    font-family: 'Cormorant Garamond', Georgia, serif;
    position: relative;
  }

  .watermark { position: absolute; left: 50%; top: 330px; width: 640px; height: 640px; transform: translate(-50%, -50%); opacity: .13; }
  .frame { position: absolute; inset: 18px; border: 1.5px solid var(--line); border-radius: 6px; }
  .frame::after { content: ''; position: absolute; inset: 6px; border: .75px solid var(--line); border-radius: 3px; }
  .corner { position: absolute; width: 64px; height: 64px; }
  .corner.tl { top: 10px; left: 10px; }
  .corner.tr { top: 10px; right: 10px; transform: scaleX(-1); }
  .corner.bl { bottom: 10px; left: 10px; transform: scaleY(-1); }
  .corner.br { bottom: 10px; right: 10px; transform: scale(-1,-1); }
  .garland { position: absolute; top: 0; left: 0; width: 540px; height: 120px; }

  .content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 84px 44px 0; }

  .bismillah { font-family: 'Amiri', serif; font-size: 21px; color: var(--accent); direction: rtl; }
  .bangla { font-family: 'Tiro Bangla', serif; font-size: 17px; color: var(--accent); margin-top: 2px; letter-spacing: .02em; }

  .arch-wrap { position: relative; margin-top: 30px; width: 162px; height: 212px; }
  .arch { position: absolute; inset: 0; border-radius: 999px 999px 14px 14px; overflow: hidden;
          border: 3px solid var(--accent); box-shadow: 0 0 0 5px var(--glow), 0 0 0 6.5px var(--line), 0 14px 30px rgba(0,0,0,.28); }
  .arch img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; }
  .finial { position: absolute; left: 50%; top: -22px; transform: translateX(-50%); width: 34px; }

  .kicker { font-family: 'Marcellus', serif; font-size: 10.5px; letter-spacing: .32em; text-transform: uppercase; color: var(--soft); }
  .k1 { margin-top: 20px; }

  .names { margin-top: 6px; font-weight: 500; font-style: italic; line-height: 1.02; }
  .names .n { font-size: 34px; display: block; }
  .names .amp { font-family: 'Pinyon Script', cursive; font-style: normal; font-size: 42px; line-height: .8; color: var(--accent); display: block; margin: 4px 0 2px; }

  .k2 { margin-top: 16px; }
  .title { font-family: 'Pinyon Script', cursive; font-size: 66px; line-height: 1; color: var(--accent); margin-top: 6px; }
  .tagline { font-style: italic; font-size: 16px; color: var(--soft); margin-top: 2px; }

  .date { display: flex; align-items: center; gap: 18px; margin-top: 18px; }
  .date .side { font-family: 'Marcellus', serif; font-size: 12px; letter-spacing: .28em; text-transform: uppercase;
                width: 120px; padding: 8px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .date .day { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 64px; line-height: .9; color: var(--accent); }
  .date .small { display: block; font-family: 'Jost', sans-serif; letter-spacing: .12em; font-size: 10.5px; color: var(--soft); margin-top: 3px; }

  .divider { width: 140px; margin: 16px 0 8px; }
  .venue { font-weight: 600; font-size: 25px; letter-spacing: .01em; }
  .addr { font-family: 'Jost', sans-serif; font-size: 12.5px; color: var(--soft); margin-top: 3px; letter-spacing: .03em; }

  .footer { position: absolute; left: 0; right: 0; bottom: 44px; text-align: center; }
  .footer .kicker { font-size: 9px; }
  .footer .url { font-family: 'Jost', sans-serif; font-size: 11.5px; letter-spacing: .04em; margin-top: 5px; color: var(--ink); }
</style>
</head>
<body>
  <svg class="watermark" id="mandala" viewBox="-100 -100 200 200"></svg>
  <svg class="garland" id="garland" viewBox="0 0 540 120"></svg>
  <div class="frame"></div>
  <svg class="corner tl" viewBox="0 0 64 64"><use href="#cornerArt"/></svg>
  <svg class="corner tr" viewBox="0 0 64 64"><use href="#cornerArt"/></svg>
  <svg class="corner bl" viewBox="0 0 64 64"><use href="#cornerArt"/></svg>
  <svg class="corner br" viewBox="0 0 64 64"><use href="#cornerArt"/></svg>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <g id="cornerArt" fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-linecap="round">
        <path d="M8 40 Q8 8 40 8" />
        <path d="M14 46 Q14 14 46 14" stroke-opacity=".55" />
        <circle cx="8" cy="8" r="3.2" fill="var(--accent)" stroke="none" />
        <path d="M18 18 q8 -2 10 6 q-8 2 -10 -6z" fill="var(--accent)" fill-opacity=".85" stroke="none" />
        <circle cx="40" cy="8" r="1.8" fill="var(--accent)" stroke="none" />
        <circle cx="8" cy="40" r="1.8" fill="var(--accent)" stroke="none" />
      </g>
    </defs>
  </svg>

  <div class="content">
    <div class="bismillah">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</div>
    <div class="bangla" id="bangla"></div>

    <div class="arch-wrap">
      <svg class="finial" viewBox="0 0 34 26"><path d="M17 0 C21 8 30 12 30 19 C30 24 24 26 17 26 C10 26 4 24 4 19 C4 12 13 8 17 0Z" fill="var(--accent)"/><circle cx="17" cy="17" r="3.5" fill="var(--bg2)"/></svg>
      <div class="arch"><img src="../public/images/couple.webp" alt="" /></div>
    </div>

    <div class="kicker k1">Together with their families</div>
    <div class="names">
      <span class="n">Jeshfique Mahmud</span>
      <span class="amp">&amp;</span>
      <span class="n">Faheema Shaheed Tamanna</span>
    </div>

    <div class="kicker k2" id="invite"></div>
    <div class="title" id="title"></div>
    <div class="tagline" id="tagline"></div>

    <div class="date">
      <div class="side" id="weekday"></div>
      <div class="day" id="day"></div>
      <div class="side" id="month"></div>
    </div>
    <div class="kicker" style="margin-top:10px" id="time"></div>

    <svg class="divider" viewBox="0 0 140 12"><line x1="0" y1="6" x2="56" y2="6" stroke="var(--line)"/><line x1="84" y1="6" x2="140" y2="6" stroke="var(--line)"/><path d="M70 0 L76 6 L70 12 L64 6Z" fill="var(--accent)"/><circle cx="58" cy="6" r="1.6" fill="var(--accent)"/><circle cx="82" cy="6" r="1.6" fill="var(--accent)"/></svg>
    <div class="venue" id="venue"></div>
    <div class="addr" id="addr"></div>
  </div>

  <div class="footer">
    <div class="kicker">Kindly RSVP &amp; find directions at</div>
    <div class="url">jeshfiquemahmud.github.io/Wedding-Invitation</div>
  </div>

<script>
  const EVENTS = {
    holud: {
      bangla: 'সঙ্গীত',
      invite: 'joyfully invite you to the',
      title: 'Sangeet',
      tagline: 'Turmeric, marigolds, music & the first blessings',
      weekday: 'Friday', day: '25', month: 'December<span class="small">2026</span>',
      time: 'From 6:00 in the evening',
      venue: 'Eagle Hall',
      addr: 'BAF Base Bashar, Dhaka'
    },
    reception: {
      bangla: 'শুভ বিবাহ',
      invite: 'request your presence at their',
      title: 'Wedding Reception',
      tagline: 'An evening of duas, dinner & celebration',
      weekday: 'Sunday', day: '27', month: 'December<span class="small">2026</span>',
      time: 'From 6:00 in the evening',
      venue: 'SKS Convention Hall',
      addr: 'SKS Tower, 7 VIP Road, Mohakhali, Dhaka'
    }
  };
  const key = new URLSearchParams(location.search).get('event') === 'reception' ? 'reception' : 'holud';
  document.body.className = key;
  const ev = EVENTS[key];
  for (const id of ['bangla','invite','title','tagline','weekday','day','time','venue','addr']) document.getElementById(id).textContent = ev[id];
  document.getElementById('month').innerHTML = ev.month;
  if (key === 'reception') document.getElementById('title').style.fontSize = '56px';

  // Alpana mandala watermark
  const NS = 'http://www.w3.org/2000/svg';
  const m = document.getElementById('mandala');
  const add = (el, attrs, parent = m) => { const n = document.createElementNS(NS, el); for (const k in attrs) n.setAttribute(k, attrs[k]); parent.appendChild(n); return n; };
  const g = add('g', { fill: 'none', stroke: 'var(--wm)', 'stroke-width': '0.8' });
  [92, 70, 30, 12].forEach(r => add('circle', { r }, g));
  for (let i = 0; i < 16; i++) {
    const a = i * 22.5;
    add('path', { d: 'M0 -32 C10 -48 10 -62 0 -70 C-10 -62 -10 -48 0 -32Z', transform: `rotate(${a})` }, g);
    add('path', { d: 'M0 -72 C6 -80 6 -86 0 -92 C-6 -86 -6 -80 0 -72Z', transform: `rotate(${a + 11.25})` }, g);
  }
  for (let i = 0; i < 8; i++) add('path', { d: 'M0 -12 C6 -18 6 -24 0 -30 C-6 -24 -6 -18 0 -12Z', transform: `rotate(${i * 45})` }, g);

  // Marigold garland swags across the top (holud) / gold bead swags (reception)
  const gl = document.getElementById('garland');
  const swags = [[18, 190], [190, 350], [350, 522]];
  const flower = key === 'holud' ? ['#C9432F', '#E0861C', '#FFD27A'] : ['#E2A63E', '#EBC57E', '#F7EFE1'];
  swags.forEach(([x1, x2], si) => {
    const depth = si === 1 ? 30 : 24, n = 13;
    for (let i = 0; i <= n; i++) {
      const t = i / n, x = x1 + (x2 - x1) * t, y = 18 + Math.sin(Math.PI * t) * depth;
      const r = key === 'holud' ? 5.2 : 3.2;
      add('circle', { cx: x, cy: y, r, fill: flower[i % flower.length], stroke: 'rgba(0,0,0,.18)', 'stroke-width': .5 }, gl);
    }
    // hanging tassel at each joint
  });
  [18, 190, 350, 522].forEach(x => {
    add('line', { x1: x, y1: 18, x2: x, y2: 54, stroke: 'var(--accent)', 'stroke-width': 1, 'stroke-dasharray': '2 3' }, gl);
    add('circle', { cx: x, cy: 58, r: 4, fill: key === 'holud' ? '#3F6B48' : '#C9432F' }, gl);
  });
</script>
</body>
</html>
